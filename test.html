<!DOCTYPE html>
<html>
<head>
<style>
.navbar { position: sticky; top: 0; background: #fff; height: 60px; border-bottom: 1px solid #ccc; display: flex; }
.navbar-inner { display: flex; gap: 20px; align-items: stretch; height: 100%; }
.navbar-link-wrapper { height: 100%; display: flex; align-items: center; }
.navbar-link { padding: 10px; position: relative; }
.mega-menu { position: absolute; top: 100%; left: 0; width: 100%; background: #111; color: #fff; height: 200px; }
</style>
</head>
<body>
<div class="navbar">
  <div class="navbar-inner">
    <div class="navbar-link-wrapper">
      <a class="navbar-link" href="#">SPORTS</a>
      <div class="mega-menu">MEGA MENU CONTENT</div>
    </div>
  </div>
</div>
</body>
</html>
